<div class="input-with-label">
  <label class="input-with-label__label">{{ label }}</label>
  <app-input-with-error
    [value]="value"
    [disabled]="disabled"
    [errorMessage]="errorMessage"
    [control]="control"
    [placeholder]="placeholder"
    [type]="type"
  ></app-input-with-error>
</div>
